nodeLinker: pnp

npmRegistryServer: "https://nodeproxy.intra.allegro-packets.com/"

packageExtensions:
    "@carbon/charts@*":
        dependencies:
            d3-shape: "*"
            d3-scale: "*"
            d3-array: "*"
            "@types/topojson-specification": "*"
            d3-brush: "*"
            d3-selection: "*"
    "@analogjs/vitest-angular@*":
        dependencies:
            "@angular-devkit/architect": "*"

    "@analogjs/vite-plugin-angular@*":
        dependencies:
            "vite": "*"
            "fast-glob": "*"

pnpEnableEsmLoader: true
